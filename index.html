<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WorkBuddy 对话</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
    background: #f5f5f7;
    color: #1c1c1e;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  /* 顶栏 */
  .header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(255,255,255,0.85);
    backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 0.5px solid rgba(0,0,0,0.1);
    padding: 12px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .back-btn {
    display: none;
    background: none; border: none; font-size: 17px;
    color: #007aff; cursor: pointer; padding: 4px 8px; margin-left: -8px;
  }
  .back-btn.visible { display: block; }
  .header h1 { font-size: 17px; font-weight: 600; flex: 1; text-align: center; }
  .header.with-back h1 { text-align: left; }
  .refresh-btn {
    background: none; border: none; font-size: 20px;
    color: #007aff; cursor: pointer; padding: 4px 8px;
  }
  /* Tabs */
  .tabs {
    display: flex; gap: 0;
    background: #fff; border-bottom: 0.5px solid rgba(0,0,0,0.08);
  }
  .tab {
    flex: 1; padding: 12px 0;
    background: none; border: none;
    font-size: 15px; font-weight: 500;
    color: #8e8e93; cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
  }
  .tab.active {
    color: #007aff;
    border-bottom-color: #007aff;
  }
  /* 搜索 */
  .search-box {
    padding: 8px 16px; background: #f5f5f7;
    border-bottom: 0.5px solid rgba(0,0,0,0.05);
    display: flex; gap: 8px; align-items: center;
  }
  .search-mode {
    display: flex; background: #e5e5ea; border-radius: 8px; padding: 2px;
    flex-shrink: 0;
  }
  .mode-btn {
    padding: 5px 10px; background: none; border: none;
    font-size: 13px; font-weight: 500; color: #8e8e93;
    border-radius: 6px; cursor: pointer; transition: all 0.15s;
  }
  .mode-btn.active { background: #fff; color: #1c1c1e; box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
  .search-box input {
    flex: 1; padding: 8px 12px;
    background: #fff; border: 0.5px solid rgba(0,0,0,0.1);
    border-radius: 10px; font-size: 15px;
  }
  /* 搜索结果 */
  .search-result {
    background: #fff; padding: 12px 16px; margin-bottom: 8px;
    border-radius: 12px; cursor: pointer;
    border: 0.5px solid rgba(0,0,0,0.06);
  }
  .search-result:active { background: #e5e5ea; }
  .search-result .source-tag {
    display: inline-block; padding: 1px 6px; margin-right: 6px;
    font-size: 10px; font-weight: 600; border-radius: 4px;
    background: #f0f0f2; color: #8e8e93;
  }
  .search-result .source-tag.openminis { background: #e8f4fd; color: #007aff; }
  .search-result .title-line {
    font-size: 13px; color: #8e8e93; margin-bottom: 4px;
  }
  .search-result .content-preview {
    font-size: 14px; color: #1c1c1e; line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .search-result .content-preview mark {
    background: #ffe58f; color: inherit; padding: 0 1px; border-radius: 2px;
  }
  /* 会话列表 */
  .conv-list { padding-bottom: 20px; }
  .conv-item {
    background: #fff; padding: 14px 16px;
    border-bottom: 0.5px solid rgba(0,0,0,0.05);
    cursor: pointer; transition: background 0.15s;
  }
  .conv-item:active { background: #e5e5ea; }
  .conv-title {
    font-size: 16px; font-weight: 500; margin-bottom: 4px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .conv-meta {
    font-size: 13px; color: #8e8e93;
    display: flex; justify-content: space-between;
  }
  /* 消息列表 */
  .msg-list { padding: 12px 12px 40px; }
  .msg-item {
    margin-bottom: 12px;
    display: flex; flex-direction: column;
  }
  .msg-item.user { align-items: flex-end; }
  .msg-item.assistant { align-items: flex-start; }
  .msg-bubble {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 15px;
    white-space: pre-wrap;
    word-break: break-word;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .msg-item.user .msg-bubble {
    background: #007aff; color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg-item.assistant .msg-bubble {
    background: #fff; color: #1c1c1e;
    border-bottom-left-radius: 4px;
  }
  .msg-meta {
    font-size: 11px; color: #8e8e93;
    margin-top: 4px; padding: 0 6px;
  }
  /* 状态 */
  .empty, .loading, .error {
    text-align: center; padding: 60px 20px;
    color: #8e8e93; font-size: 15px;
  }
  .error { color: #ff3b30; }
  .hidden { display: none !important; }
  /* 加载更多 */
  .load-more {
    text-align: center; padding: 12px;
    color: #007aff; font-size: 15px; cursor: pointer;
  }
</style>
</head>
<body>

<div class="header" id="header">
  <button class="back-btn" id="backBtn" onclick="goBack()">‹ 返回</button>
  <h1 id="headerTitle">对话历史</h1>
  <button class="refresh-btn" onclick="refresh()" title="刷新">⟳</button>
  <button class="refresh-btn" id="logoutBtn" onclick="signOut()" title="登出" style="display:none;">⏻</button>
</div>

<div class="tabs" id="tabs">
  <button class="tab active" data-source="workbuddy" onclick="switchSource('workbuddy')">WorkBuddy</button>
  <button class="tab" data-source="openminis" onclick="switchSource('openminis')">OpenMinis</button>
</div>

<div class="search-box" id="searchBox">
  <div class="search-mode">
    <button class="mode-btn active" data-mode="title" onclick="setSearchMode('title')">标题</button>
    <button class="mode-btn" data-mode="content" onclick="setSearchMode('content')">全文</button>
  </div>
  <input type="search" id="searchInput" placeholder="搜索会话标题…" oninput="onSearchInput()" onkeydown="if(event.key==='Enter')runSearch()">
</div>

<div id="content">
  <div class="loading">加载中…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ====== 配置 ======
const SUPABASE_URL = "https://elecldbgysdbymkyucwf.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsZWNsZGJneXNkYnlta3l1Y3dmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2NDQ2ODksImV4cCI6MjEwNzIyMDY4OX0.yyMZB0b-FGi8R5o-79-Pv50n3zDRVICmwVNlPNZ3eYU";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ====== 状态 ======
let allConversations = [];
let currentConversation = null;
let currentMessages = [];
let messageOffset = 0;
const MESSAGE_PAGE_SIZE = 50;
let currentUser = null;
let currentSource = 'workbuddy';  // 'workbuddy' | 'openminis'

// 数据源配置：表名 + 字段映射
const SOURCES = {
  workbuddy: {
    sessionTable: 'conversations',
    messageTable: 'messages',
    sessionIdField: 'id',
    messageSessionField: 'conversation_id',
    titleField: 'title',
    timeField: 'last_message_at',
    orderField: 'created_at',
  },
  openminis: {
    sessionTable: 'openminis_sessions',
    messageTable: 'openminis_messages',
    sessionIdField: 'session_id',
    messageSessionField: 'session_id',
    titleField: 'title',
    timeField: 'updated_at',
    orderField: 'message_index',
  },
};

async function switchSource(source) {
  if (currentSource === source) return;
  currentSource = source;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.source === source);
  });
  showConversationList();
  await loadConversations();
}

// ====== 视图切换 ======
function showConversationList() {
  currentConversation = null;
  document.getElementById('backBtn').classList.remove('visible');
  document.getElementById('header').classList.remove('with-back');
  document.getElementById('headerTitle').textContent = currentSource === 'openminis' ? 'OpenMinis 历史' : 'WorkBuddy 对话';
  document.getElementById('searchBox').classList.remove('hidden');
  renderConversationList(allConversations);
}

function showConversation(conv) {
  currentConversation = conv;
  messageOffset = 0;
  currentMessages = [];
  const cfg = SOURCES[currentSource];
  document.getElementById('backBtn').classList.add('visible');
  document.getElementById('header').classList.add('with-back');
  document.getElementById('headerTitle').textContent = conv.title || '未命名会话';
  document.getElementById('searchBox').classList.add('hidden');
  document.getElementById('content').innerHTML = '<div class="loading">加载消息…</div>';
  loadMessages(conv[cfg.sessionIdField], true);
}

function goBack() { showConversationList(); }
function refresh() {
  if (currentConversation) {
    showConversation(currentConversation);
  } else {
    loadConversations();
  }
}

// ====== API ======
async function loadConversations() {
  const cfg = SOURCES[currentSource];
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading">加载会话…</div>';
  try {
    let query = sb.from(cfg.sessionTable).select('*');
    if (currentSource === 'workbuddy') {
      query = query.order('last_message_at', { ascending: false });
    } else {
      query = query.order('updated_at', { ascending: false });
    }
    const { data, error } = await query.limit(200);
    if (error) throw error;
    allConversations = data || [];
    renderConversationList(allConversations);
  } catch (e) {
    content.innerHTML = `<div class="error">加载失败<br><small>${e.message}</small></div>`;
  }
}

function renderConversationList(convs) {
  const cfg = SOURCES[currentSource];
  const content = document.getElementById('content');
  if (!convs.length) {
    content.innerHTML = '<div class="empty">还没有对话记录<br><small>在电脑上聊一句试试</small></div>';
    return;
  }
  content.innerHTML = '<div class="conv-list">' + convs.map(c => {
    const title = c[cfg.titleField] || '未命名会话';
    const time = c[cfg.timeField];
    const extra = currentSource === 'openminis' && c.message_count
      ? `<span>${c.message_count} 条</span>` : '';
    return `
    <div class="conv-item" onclick='showConversation(${JSON.stringify(c).replace(/'/g, "&#39;")})'>
      <div class="conv-title">${escapeHtml(title)}</div>
      <div class="conv-meta">
        <span>${formatTime(time)}</span>
        ${extra}
      </div>
    </div>
    `;
  }).join('') + '</div>';
}

function filterConversations() {
  const cfg = SOURCES[currentSource];
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  if (!q) {
    renderConversationList(allConversations);
    return;
  }
  renderConversationList(allConversations.filter(c =>
    (c[cfg.titleField] || '').toLowerCase().includes(q)
  ));
}

// ====== 全局搜索 ======
let searchMode = 'title';  // 'title' | 'content'

function setSearchMode(mode) {
  searchMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  const placeholder = mode === 'title' ? '搜索会话标题…' : '搜索消息内容…';
  document.getElementById('searchInput').placeholder = placeholder;
  onSearchInput();
}

function onSearchInput() {
  if (searchMode === 'title') {
    filterConversations();
  } else {
    // 全文模式：输入停顿 500ms 后自动搜
    clearTimeout(window._searchTimer);
    const q = document.getElementById('searchInput').value.trim();
    if (!q) {
      renderConversationList(allConversations);
      return;
    }
    window._searchTimer = setTimeout(() => runSearch(), 500);
  }
}

async function runSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  if (searchMode === 'title') {
    filterConversations();
    return;
  }
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading">搜索中…</div>';
  try {
    const { data, error } = await sb.rpc('search_messages', {
      search_query: q,
      source_filter: null,
      result_limit: 50,
    });
    if (error) throw error;
    renderSearchResults(data || [], q);
  } catch (e) {
    content.innerHTML = `<div class="error">搜索失败<br><small>${e.message}</small></div>`;
  }
}

function renderSearchResults(results, query) {
  const content = document.getElementById('content');
  if (!results.length) {
    content.innerHTML = `<div class="empty">没有找到包含「${escapeHtml(query)}」的消息</div>`;
    return;
  }
  let html = `<div style="padding: 8px 12px; color: #8e8e93; font-size: 13px;">找到 ${results.length} 条结果</div>`;
  html += '<div style="padding: 0 12px 20px;">';
  html += results.map(r => {
    // 高亮关键词（简单 replace，忽略大小写）
    const re = new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    const preview = escapeHtml(r.content.slice(0, 300)).replace(re, m => `<mark>${m}</mark>`);
    return `
    <div class="search-result" onclick='jumpToConversation(${JSON.stringify({source: r.source, session_id: r.session_id, title: r.title || '未命名'})})'>
      <div class="title-line">
        <span class="source-tag ${r.source}">${r.source === 'openminis' ? 'OpenMinis' : 'WorkBuddy'}</span>
        ${escapeHtml(r.title || '未命名会话')}
        <span style="margin-left: 6px;">· ${formatTime(r.created_at)}</span>
      </div>
      <div class="content-preview">${preview}</div>
    </div>
    `;
  }).join('');
  html += '</div>';
  content.innerHTML = html;
}

async function jumpToConversation(hit) {
  // 切换到对应 tab，再打开会话
  if (hit.source !== currentSource) {
    await switchSource(hit.source);
  }
  const cfg = SOURCES[hit.source];
  let conv = allConversations.find(c => c[cfg.sessionIdField] === hit.session_id);
  if (!conv) {
    // 直接构造一个最小对象
    conv = { [cfg.sessionIdField]: hit.session_id, title: hit.title };
  }
  showConversation(conv);
}

async function loadMessages(sessionId, initial = false) {
  const cfg = SOURCES[currentSource];
  try {
    // openminis 用 message_index 升序；workbuddy 用 created_at 倒序拿最近 N 条
    let query = sb.from(cfg.messageTable)
      .select('*')
      .eq(cfg.messageSessionField, sessionId);

    if (currentSource === 'openminis') {
      query = query.order('message_index', { ascending: true })
                   .range(messageOffset, messageOffset + MESSAGE_PAGE_SIZE - 1);
    } else {
      query = query.order('created_at', { ascending: false })
                   .range(messageOffset, messageOffset + MESSAGE_PAGE_SIZE - 1);
    }

    const { data, error } = await query;
    if (error) throw error;
    const rows = data || [];
    // workbuddy 拉的是倒序，要反过来
    const newMsgs = currentSource === 'workbuddy' ? rows.reverse() : rows;
    if (initial) {
      currentMessages = newMsgs;
    } else if (currentSource === 'openminis') {
      // openminis 翻页是往后翻（更老的消息）
      currentMessages = currentMessages.concat(newMsgs);
    } else {
      currentMessages = newMsgs.concat(currentMessages);
    }
    messageOffset += rows.length;
    renderMessages(rows.length >= MESSAGE_PAGE_SIZE);
  } catch (e) {
    document.getElementById('content').innerHTML =
      `<div class="error">加载失败<br><small>${e.message}</small></div>`;
  }
}

function renderMessages(hasMore) {
  const content = document.getElementById('content');
  if (!currentMessages.length) {
    content.innerHTML = '<div class="empty">这个会话还没有消息</div>';
    return;
  }
  let html = '<div class="msg-list">';
  if (hasMore) {
    const label = currentSource === 'openminis' ? '加载更多消息' : '加载更早的消息';
    html += `<div class="load-more" onclick="loadOlder()">${label}</div>`;
  }
  html += currentMessages.map(m => {
    const role = m.role === 'user' ? 'user' : 'assistant';
    const time = m.created_at || '';
    return `
      <div class="msg-item ${role}">
        <div class="msg-bubble">${escapeHtml(m.content)}</div>
        <div class="msg-meta">${formatTime(time)}</div>
      </div>
    `;
  }).join('');
  html += '</div>';
  content.innerHTML = html;
  // 滚到底部
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'instant' });
}

function loadOlder() {
  const cfg = SOURCES[currentSource];
  loadMessages(currentConversation[cfg.sessionIdField], false);
}

// ====== 工具 ======
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function formatTime(isoStr) {
  if (!isoStr) return '';
  const d = new Date(isoStr);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const yesterday = new Date(now); yesterday.setDate(now.getDate() - 1);
  const isYesterday = d.toDateString() === yesterday.toDateString();
  const time = d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  if (sameDay) return time;
  if (isYesterday) return '昨天 ' + time;
  if (d.getFullYear() === now.getFullYear()) {
    return d.toLocaleDateString('zh-CN', { month: 'numeric', day: 'numeric' }) + ' ' + time;
  }
  return d.toLocaleDateString('zh-CN') + ' ' + time;
}

// ====== 登录 / 启动 ======
// 简单的"邮箱即口令"验证。匹配以下任一邮箱即可访问（不区分大小写、忽略前后空格）。
const ALLOWED_EMAILS = ['ronglaiz@yahoo.com', '105229365@qq.com'];
const AUTH_KEY = 'wb_viewer_auth_email';

function isAuthed() {
  const saved = (localStorage.getItem(AUTH_KEY) || '').trim().toLowerCase();
  return ALLOWED_EMAILS.includes(saved);
}

function signIn(email) {
  const normalized = email.trim().toLowerCase();
  if (!ALLOWED_EMAILS.includes(normalized)) {
    throw new Error('邮箱不在允许列表');
  }
  localStorage.setItem(AUTH_KEY, normalized);
  currentUser = { email: normalized };
}

function signOut() {
  localStorage.removeItem(AUTH_KEY);
  currentUser = null;
  showLoginScreen();
}

function showLoginScreen() {
  document.getElementById('headerTitle').textContent = '验证身份';
  document.getElementById('backBtn').classList.remove('visible');
  document.getElementById('searchBox').classList.add('hidden');
  document.getElementById('tabs').style.display = 'none';
  document.getElementById('content').innerHTML = `
    <div style="padding: 40px 24px; max-width: 400px; margin: 0 auto;">
      <div style="font-size: 32px; text-align: center; margin-bottom: 8px;">💪</div>
      <div style="font-size: 17px; font-weight: 600; text-align: center; margin-bottom: 8px;">输入邮箱查看对话</div>
      <div style="font-size: 13px; color: #8e8e93; text-align: center; margin-bottom: 24px;">仅限授权的邮箱可以访问</div>
      <input id="loginEmail" type="email" placeholder="your@email.com" autocomplete="email" style="
        width: 100%; padding: 12px 14px; margin-bottom: 16px;
        border: 0.5px solid rgba(0,0,0,0.15); border-radius: 10px;
        font-size: 15px; background: #fff;
      ">
      <button onclick="doLogin()" style="
        width: 100%; padding: 13px;
        background: #007aff; color: #fff; border: none; border-radius: 10px;
        font-size: 16px; font-weight: 600; cursor: pointer;
      ">进入</button>
      <div id="loginError" style="color: #ff3b30; font-size: 14px; margin-top: 12px; text-align: center;"></div>
    </div>
  `;
  setTimeout(() => {
    const el = document.getElementById('loginEmail');
    if (el) {
      el.focus();
      el.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    }
  }, 100);
}

function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  if (!email) {
    errEl.textContent = '请输入邮箱';
    return;
  }
  try {
    signIn(email);
    document.getElementById('logoutBtn').style.display = 'block';
    document.getElementById('tabs').style.display = 'flex';
    showConversationList();
    loadConversations();
  } catch (e) {
    errEl.textContent = e.message || '验证失败';
  }
}

async function boot() {
  if (isAuthed()) {
    currentUser = { email: localStorage.getItem(AUTH_KEY) };
    document.getElementById('logoutBtn').style.display = 'block';
    document.getElementById('tabs').style.display = 'flex';
    showConversationList();
    loadConversations();
  } else {
    showLoginScreen();
  }
}

boot();
// 已登录时每 30s 刷新当前视图
setInterval(() => { if (isAuthed()) refresh(); }, 30000);
</script>

</body>
</html>
