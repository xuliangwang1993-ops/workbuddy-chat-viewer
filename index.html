<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WorkBuddy 对话</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
    background: #f5f5f7;
    color: #1c1c1e;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  /* 顶栏 */
  .header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(255,255,255,0.85);
    backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 0.5px solid rgba(0,0,0,0.1);
    padding: 12px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .back-btn {
    display: none;
    background: none; border: none; font-size: 17px;
    color: #007aff; cursor: pointer; padding: 4px 8px; margin-left: -8px;
  }
  .back-btn.visible { display: block; }
  .header h1 { font-size: 17px; font-weight: 600; flex: 1; text-align: center; }
  .header.with-back h1 { text-align: left; }
  .refresh-btn {
    background: none; border: none; font-size: 20px;
    color: #007aff; cursor: pointer; padding: 4px 8px;
  }
  /* Tabs */
  .tabs {
    display: flex; gap: 0;
    background: #fff; border-bottom: 0.5px solid rgba(0,0,0,0.08);
  }
  .tab {
    flex: 1; padding: 12px 0;
    background: none; border: none;
    font-size: 15px; font-weight: 500;
    color: #8e8e93; cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
  }
  .tab.active {
    color: #007aff;
    border-bottom-color: #007aff;
  }
  /* 搜索 */
  .search-box {
    padding: 8px 16px; background: #f5f5f7;
    border-bottom: 0.5px solid rgba(0,0,0,0.05);
    display: flex; gap: 8px; align-items: center;
  }
  .search-mode {
    display: flex; background: #e5e5ea; border-radius: 8px; padding: 2px;
    flex-shrink: 0;
  }
  .mode-btn {
    padding: 5px 10px; background: none; border: none;
    font-size: 13px; font-weight: 500; color: #8e8e93;
    border-radius: 6px; cursor: pointer; transition: all 0.15s;
  }
  .mode-btn.active { background: #fff; color: #1c1c1e; box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
  .search-box input {
    flex: 1; padding: 8px 12px;
    background: #fff; border: 0.5px solid rgba(0,0,0,0.1);
    border-radius: 10px; font-size: 15px;
  }
  /* 搜索结果 */
  .search-result {
    background: #fff; padding: 12px 16px; margin-bottom: 8px;
    border-radius: 12px; cursor: pointer;
    border: 0.5px solid rgba(0,0,0,0.06);
  }
  .search-result:active { background: #e5e5ea; }
  .search-result .source-tag {
    display: inline-block; padding: 1px 6px; margin-right: 6px;
    font-size: 10px; font-weight: 600; border-radius: 4px;
    background: #f0f0f2; color: #8e8e93;
  }
  .search-result .source-tag.openminis { background: #e8f4fd; color: #007aff; }
  .search-result .title-line {
    font-size: 13px; color: #8e8e93; margin-bottom: 4px;
  }
  .search-result .content-preview {
    font-size: 14px; color: #1c1c1e; line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .search-result .content-preview mark {
    background: #ffe58f; color: inherit; padding: 0 1px; border-radius: 2px;
  }
  /* 图谱 */
  .graph-container {
    padding: 16px; background: #f5f5f7; min-height: 60vh;
  }
  .graph-stats {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
    margin-bottom: 16px;
  }
  .stat-card {
    background: #fff; border-radius: 10px; padding: 10px 6px;
    text-align: center; border: 0.5px solid rgba(0,0,0,0.06);
  }
  .stat-num { font-size: 20px; font-weight: 700; line-height: 1.1; }
  .stat-label { font-size: 11px; color: #8e8e93; margin-top: 2px; }
  .stat-card.active .stat-num { color: #007aff; }
  .stat-card.blocked .stat-num { color: #ff3b30; }
  .stat-card.waiting .stat-num { color: #ff9500; }
  .stat-card.done .stat-num { color: #34c759; }
  .stat-card.abandoned .stat-num { color: #8e8e93; }
  .tree-node {
    background: #fff; border-radius: 10px; padding: 12px 14px;
    margin-bottom: 6px; border-left: 3px solid #e5e5ea;
    border-top: 0.5px solid rgba(0,0,0,0.04);
    border-right: 0.5px solid rgba(0,0,0,0.04);
    border-bottom: 0.5px solid rgba(0,0,0,0.04);
  }
  .tree-project { border-left-color: #5856d6; font-weight: 600; }
  .tree-branch { margin-left: 16px; }
  .tree-ticket { margin-left: 32px; font-size: 14px; }
  .tree-header { display: flex; align-items: center; gap: 8px; }
  .tree-title { flex: 1; font-size: 15px; }
  .tree-ticket .tree-title { font-size: 14px; }
  .status-badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    font-size: 11px; font-weight: 600;
  }
  .status-active { background: #e3f2fd; color: #007aff; }
  .status-blocked { background: #ffebee; color: #ff3b30; }
  .status-waiting { background: #fff4e5; color: #ff9500; }
  .status-done { background: #e8f5e9; color: #34c759; }
  .status-abandoned { background: #f5f5f7; color: #8e8e93; }
  .tree-summary {
    font-size: 12px; color: #8e8e93; margin-top: 4px; line-height: 1.4;
  }
  .tree-time {
    font-size: 11px; color: #c7c7cc; margin-left: auto;
  }
  /* 派工按钮 */
  .node-actions {
    display: flex; gap: 8px; margin-top: 8px;
    padding-top: 8px; border-top: 0.5px dashed rgba(0,0,0,0.08);
  }
  .action-btn {
    flex: 1; padding: 7px 10px; border-radius: 8px;
    font-size: 12px; font-weight: 600; cursor: pointer;
    border: none; transition: all 0.15s;
  }
  .action-dispatch {
    background: #007aff; color: #fff;
  }
  .action-dispatch:active { background: #0051d5; }
  .action-pr {
    background: #34c759; color: #fff;
  }
  .action-pr:active { background: #28a745; }
  .action-view-pr {
    background: #f0f0f2; color: #1c1c1e;
    text-decoration: none; display: inline-flex;
    align-items: center; justify-content: center;
  }
  .pr-badge {
    display: inline-block; padding: 2px 8px; margin-left: 6px;
    background: #8957e5; color: #fff;
    border-radius: 10px; font-size: 10px; font-weight: 600;
  }
  .pr-badge.merged { background: #34c759; }
  /* Prompt 弹窗 */
  .prompt-modal {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.5);
    display: flex; align-items: flex-end;
  }
  .prompt-sheet {
    background: #fff; width: 100%;
    border-radius: 16px 16px 0 0;
    padding: 20px; max-height: 80vh;
    display: flex; flex-direction: column;
  }
  .prompt-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .prompt-title { font-size: 16px; font-weight: 600; }
  .prompt-close {
    background: none; border: none; font-size: 24px;
    color: #8e8e93; cursor: pointer; padding: 0 8px;
  }
  .prompt-text {
    flex: 1; overflow-y: auto;
    background: #f5f5f7; padding: 12px; border-radius: 8px;
    font-family: ui-monospace, monospace; font-size: 12px;
    white-space: pre-wrap; word-break: break-word;
    user-select: text; -webkit-user-select: text;
    margin-bottom: 12px; line-height: 1.5;
  }
  .prompt-actions { display: flex; gap: 8px; }
  .prompt-copy {
    flex: 1; padding: 12px;
    background: #007aff; color: #fff;
    border: none; border-radius: 10px;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  /* 派工人选择 */
  .dispatch-options {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    margin-bottom: 12px;
  }
  .dispatch-opt {
    padding: 10px; background: #f5f5f7;
    border: 1.5px solid transparent; border-radius: 8px;
    font-size: 13px; cursor: pointer; text-align: center;
  }
  .dispatch-opt.selected {
    background: #e3f2fd; border-color: #007aff; color: #007aff;
    font-weight: 600;
  }
  /* 会话列表 */
  .conv-list { padding-bottom: 20px; }
  .conv-item {
    background: #fff; padding: 14px 16px;
    border-bottom: 0.5px solid rgba(0,0,0,0.05);
    cursor: pointer; transition: background 0.15s;
  }
  .conv-item:active { background: #e5e5ea; }
  .conv-title {
    font-size: 16px; font-weight: 500; margin-bottom: 4px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .conv-meta {
    font-size: 13px; color: #8e8e93;
    display: flex; justify-content: space-between;
  }
  /* 消息列表 */
  .msg-list { padding: 12px 12px 40px; }
  .msg-item {
    margin-bottom: 12px;
    display: flex; flex-direction: column;
  }
  .msg-item.user { align-items: flex-end; }
  .msg-item.assistant { align-items: flex-start; }
  .msg-bubble {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 15px;
    white-space: pre-wrap;
    word-break: break-word;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .msg-item.user .msg-bubble {
    background: #007aff; color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg-item.assistant .msg-bubble {
    background: #fff; color: #1c1c1e;
    border-bottom-left-radius: 4px;
  }
  .msg-meta {
    font-size: 11px; color: #8e8e93;
    margin-top: 4px; padding: 0 6px;
  }
  /* 状态 */
  .empty, .loading, .error {
    text-align: center; padding: 60px 20px;
    color: #8e8e93; font-size: 15px;
  }
  .error { color: #ff3b30; }
  .hidden { display: none !important; }
  /* 加载更多 */
  .load-more {
    text-align: center; padding: 12px;
    color: #007aff; font-size: 15px; cursor: pointer;
  }
</style>
</head>
<body>

<div class="header" id="header">
  <button class="back-btn" id="backBtn" onclick="goBack()">‹ 返回</button>
  <h1 id="headerTitle">对话历史</h1>
  <button class="refresh-btn" onclick="refresh()" title="刷新">⟳</button>
  <button class="refresh-btn" id="logoutBtn" onclick="signOut()" title="登出" style="display:none;">⏻</button>
</div>

<div class="tabs" id="tabs">
  <button class="tab active" data-source="workbuddy" onclick="switchSource('workbuddy')">WorkBuddy</button>
  <button class="tab" data-source="openminis" onclick="switchSource('openminis')">OpenMinis</button>
  <button class="tab" data-source="graph" onclick="switchSource('graph')">图谱</button>
</div>

<div class="search-box" id="searchBox">
  <div class="search-mode">
    <button class="mode-btn active" data-mode="title" onclick="setSearchMode('title')">标题</button>
    <button class="mode-btn" data-mode="content" onclick="setSearchMode('content')">全文</button>
  </div>
  <input type="search" id="searchInput" placeholder="搜索会话标题…" oninput="onSearchInput()" onkeydown="if(event.key==='Enter')runSearch()">
</div>

<div id="content">
  <div class="loading">加载中…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ====== 配置 ======
const SUPABASE_URL = "https://elecldbgysdbymkyucwf.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsZWNsZGJneXNkYnlta3l1Y3dmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2NDQ2ODksImV4cCI6MjEwNzIyMDY4OX0.yyMZB0b-FGi8R5o-79-Pv50n3zDRVICmwVNlPNZ3eYU";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ====== 状态 ======
let allConversations = [];
let currentConversation = null;
let currentMessages = [];
let messageOffset = 0;
const MESSAGE_PAGE_SIZE = 50;
let currentUser = null;
let currentSource = 'workbuddy';  // 'workbuddy' | 'openminis'

// 数据源配置：表名 + 字段映射
const SOURCES = {
  workbuddy: {
    sessionTable: 'conversations',
    messageTable: 'messages',
    sessionIdField: 'id',
    messageSessionField: 'conversation_id',
    titleField: 'title',
    timeField: 'last_message_at',
    orderField: 'created_at',
  },
  openminis: {
    sessionTable: 'openminis_sessions',
    messageTable: 'openminis_messages',
    sessionIdField: 'session_id',
    messageSessionField: 'session_id',
    titleField: 'title',
    timeField: 'updated_at',
    orderField: 'message_index',
  },
};

async function switchSource(source) {
  if (currentSource === source) return;
  currentSource = source;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.source === source);
  });
  if (source === 'graph') {
    showGraph();
    await loadGraph();
  } else {
    showConversationList();
    await loadConversations();
  }
}

// ====== 视图切换 ======
function showConversationList() {
  currentConversation = null;
  document.getElementById('backBtn').classList.remove('visible');
  document.getElementById('header').classList.remove('with-back');
  document.getElementById('headerTitle').textContent = currentSource === 'openminis' ? 'OpenMinis 历史' : 'WorkBuddy 对话';
  document.getElementById('searchBox').classList.remove('hidden');
  document.getElementById('searchBox').style.display = '';
  renderConversationList(allConversations);
}

function showConversation(conv) {
  currentConversation = conv;
  messageOffset = 0;
  currentMessages = [];
  const cfg = SOURCES[currentSource];
  document.getElementById('backBtn').classList.add('visible');
  document.getElementById('header').classList.add('with-back');
  document.getElementById('headerTitle').textContent = conv.title || '未命名会话';
  document.getElementById('searchBox').classList.add('hidden');
  document.getElementById('content').innerHTML = '<div class="loading">加载消息…</div>';
  loadMessages(conv[cfg.sessionIdField], true);
}

function goBack() { showConversationList(); }
function refresh() {
  if (currentConversation) {
    showConversation(currentConversation);
  } else {
    loadConversations();
  }
}

// ====== API ======
async function loadConversations() {
  const cfg = SOURCES[currentSource];
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading">加载会话…</div>';
  try {
    let query = sb.from(cfg.sessionTable).select('*');
    if (currentSource === 'workbuddy') {
      query = query.order('last_message_at', { ascending: false });
    } else {
      query = query.order('updated_at', { ascending: false });
    }
    const { data, error } = await query.limit(200);
    if (error) throw error;
    allConversations = data || [];
    renderConversationList(allConversations);
  } catch (e) {
    content.innerHTML = `<div class="error">加载失败<br><small>${e.message}</small></div>`;
  }
}

function renderConversationList(convs) {
  const cfg = SOURCES[currentSource];
  const content = document.getElementById('content');
  if (!convs.length) {
    content.innerHTML = '<div class="empty">还没有对话记录<br><small>在电脑上聊一句试试</small></div>';
    return;
  }
  content.innerHTML = '<div class="conv-list">' + convs.map(c => {
    const title = c[cfg.titleField] || '未命名会话';
    const time = c[cfg.timeField];
    const extra = currentSource === 'openminis' && c.message_count
      ? `<span>${c.message_count} 条</span>` : '';
    return `
    <div class="conv-item" onclick='showConversation(${JSON.stringify(c).replace(/'/g, "&#39;")})'>
      <div class="conv-title">${escapeHtml(title)}</div>
      <div class="conv-meta">
        <span>${formatTime(time)}</span>
        ${extra}
      </div>
    </div>
    `;
  }).join('') + '</div>';
}

function filterConversations() {
  const cfg = SOURCES[currentSource];
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  if (!q) {
    renderConversationList(allConversations);
    return;
  }
  renderConversationList(allConversations.filter(c =>
    (c[cfg.titleField] || '').toLowerCase().includes(q)
  ));
}

// ====== 全局搜索 ======
let searchMode = 'title';  // 'title' | 'content'

function setSearchMode(mode) {
  searchMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  const placeholder = mode === 'title' ? '搜索会话标题…' : '搜索消息内容…';
  document.getElementById('searchInput').placeholder = placeholder;
  onSearchInput();
}

function onSearchInput() {
  if (searchMode === 'title') {
    filterConversations();
  } else {
    // 全文模式：输入停顿 500ms 后自动搜
    clearTimeout(window._searchTimer);
    const q = document.getElementById('searchInput').value.trim();
    if (!q) {
      renderConversationList(allConversations);
      return;
    }
    window._searchTimer = setTimeout(() => runSearch(), 500);
  }
}

async function runSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  if (searchMode === 'title') {
    filterConversations();
    return;
  }
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading">搜索中…</div>';
  try {
    const { data, error } = await sb.rpc('search_messages', {
      search_query: q,
      source_filter: null,
      result_limit: 50,
    });
    if (error) throw error;
    renderSearchResults(data || [], q);
  } catch (e) {
    content.innerHTML = `<div class="error">搜索失败<br><small>${e.message}</small></div>`;
  }
}

function renderSearchResults(results, query) {
  const content = document.getElementById('content');
  if (!results.length) {
    content.innerHTML = `<div class="empty">没有找到包含「${escapeHtml(query)}」的消息</div>`;
    return;
  }
  let html = `<div style="padding: 8px 12px; color: #8e8e93; font-size: 13px;">找到 ${results.length} 条结果</div>`;
  html += '<div style="padding: 0 12px 20px;">';
  html += results.map(r => {
    // 高亮关键词（简单 replace，忽略大小写）
    const re = new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    const preview = escapeHtml(r.content.slice(0, 300)).replace(re, m => `<mark>${m}</mark>`);
    return `
    <div class="search-result" onclick='jumpToConversation(${JSON.stringify({source: r.source, session_id: r.session_id, title: r.title || '未命名'})})'>
      <div class="title-line">
        <span class="source-tag ${r.source}">${r.source === 'openminis' ? 'OpenMinis' : 'WorkBuddy'}</span>
        ${escapeHtml(r.title || '未命名会话')}
        <span style="margin-left: 6px;">· ${formatTime(r.created_at)}</span>
      </div>
      <div class="content-preview">${preview}</div>
    </div>
    `;
  }).join('');
  html += '</div>';
  content.innerHTML = html;
}

async function jumpToConversation(hit) {
  // 切换到对应 tab，再打开会话
  if (hit.source !== currentSource) {
    await switchSource(hit.source);
  }
  const cfg = SOURCES[hit.source];
  let conv = allConversations.find(c => c[cfg.sessionIdField] === hit.session_id);
  if (!conv) {
    // 直接构造一个最小对象
    conv = { [cfg.sessionIdField]: hit.session_id, title: hit.title };
  }
  showConversation(conv);
}

// ====== 工作图谱 ======
const STATUS_LABELS = {
  active: '进行中', blocked: '卡住', waiting: '等待', done: '完成', abandoned: '搁置'
};
const KIND_LABELS = { project: '项目', branch: '分支', ticket: '工牌' };
let allNodes = [];  // 缓存节点供派工用

function showGraph() {
  document.getElementById('backBtn').classList.remove('visible');
  document.getElementById('headerTitle').textContent = '工作图谱';
  document.getElementById('searchBox').classList.add('hidden');
  document.getElementById('content').innerHTML = '<div class="loading">加载图谱…</div>';
}

async function loadGraph() {
  try {
    const { data, error } = await sb
      .from('work_nodes')
      .select('*')
      .order('last_activity_at', { ascending: false, nullsFirst: false });
    if (error) throw error;
    allNodes = data || [];
    renderGraph(allNodes);
  } catch (e) {
    document.getElementById('content').innerHTML =
      `<div class="error">图谱加载失败<br><small>${e.message}</small></div>`;
  }
}

function renderGraph(nodes) {
  const content = document.getElementById('content');
  if (!nodes.length) {
    content.innerHTML = '<div class="empty">还没有工作节点</div>';
    return;
  }
  // 统计
  const stats = { active: 0, blocked: 0, waiting: 0, done: 0, abandoned: 0 };
  nodes.forEach(n => stats[n.status] = (stats[n.status] || 0) + 1);
  // 建树
  const byId = {};
  nodes.forEach(n => byId[n.id] = { ...n, children: [] });
  const roots = [];
  nodes.forEach(n => {
    if (n.parent_id && byId[n.parent_id]) {
      byId[n.parent_id].children.push(byId[n.id]);
    } else {
      roots.push(byId[n.id]);
    }
  });
  // 子节点排序：blocked > waiting > active > done > abandoned
  const order = { blocked: 0, waiting: 1, active: 2, done: 3, abandoned: 4 };
  function sortChildren(arr) {
    arr.sort((a, b) => (order[a.status] ?? 5) - (order[b.status] ?? 5));
    arr.forEach(c => sortChildren(c.children));
  }
  sortChildren(roots);

  let html = '<div class="graph-container">';
  // 顶部统计
  html += '<div class="graph-stats">';
  ['blocked', 'waiting', 'active', 'done', 'abandoned'].forEach(s => {
    html += `<div class="stat-card ${s}">
      <div class="stat-num">${stats[s] || 0}</div>
      <div class="stat-label">${STATUS_LABELS[s]}</div>
    </div>`;
  });
  html += '</div>';

  // 树
  function renderNode(n) {
    const cls = `tree-${n.kind}`;
    const timeStr = n.last_activity_at ? formatTime(n.last_activity_at) : '';
    let prBadge = '';
    if (n.pr_url) {
      const cls2 = n.pr_status === 'merged' ? 'merged' : '';
      prBadge = `<span class="pr-badge ${cls2}">PR #${n.pr_number || '?'}</span>`;
    }
    let out = `<div class="tree-node ${cls}">
      <div class="tree-header">
        <span class="status-badge status-${n.status}">${STATUS_LABELS[n.status]}</span>
        <span class="tree-title">${escapeHtml(n.title)}${prBadge}</span>
        <span class="tree-time">${timeStr}</span>
      </div>
      ${n.summary ? `<div class="tree-summary">${escapeHtml(n.summary)}</div>` : ''}`;

    // 动作按钮
    const actions = [];
    if (n.kind === 'ticket' && (n.status === 'blocked' || n.status === 'waiting')) {
      actions.push(`<button class="action-btn action-dispatch" onclick='openDispatch(${JSON.stringify(n.id)})'>📤 派工</button>`);
    }
    if (n.pr_url) {
      actions.push(`<a class="action-btn action-view-pr" href="${n.pr_url}" target="_blank">查看 PR</a>`);
    } else if (n.kind === 'ticket' && n.status === 'active' && n.repo) {
      actions.push(`<button class="action-btn action-pr" onclick='openPRDialog(${JSON.stringify(n.id)})'>🔀 开 PR</button>`);
    }
    if (actions.length) {
      out += `<div class="node-actions">${actions.join('')}</div>`;
    }
    out += '</div>';
    if (n.children && n.children.length) {
      out += n.children.map(renderNode).join('');
    }
    return out;
  }
  html += roots.map(renderNode).join('');
  html += '</div>';
  content.innerHTML = html;
}

async function loadMessages(sessionId, initial = false) {
  const cfg = SOURCES[currentSource];
  try {
    // openminis 用 message_index 升序；workbuddy 用 created_at 倒序拿最近 N 条
    let query = sb.from(cfg.messageTable)
      .select('*')
      .eq(cfg.messageSessionField, sessionId);

    if (currentSource === 'openminis') {
      query = query.order('message_index', { ascending: true })
                   .range(messageOffset, messageOffset + MESSAGE_PAGE_SIZE - 1);
    } else {
      query = query.order('created_at', { ascending: false })
                   .range(messageOffset, messageOffset + MESSAGE_PAGE_SIZE - 1);
    }

    const { data, error } = await query;
    if (error) throw error;
    const rows = data || [];
    // workbuddy 拉的是倒序，要反过来
    const newMsgs = currentSource === 'workbuddy' ? rows.reverse() : rows;
    if (initial) {
      currentMessages = newMsgs;
    } else if (currentSource === 'openminis') {
      // openminis 翻页是往后翻（更老的消息）
      currentMessages = currentMessages.concat(newMsgs);
    } else {
      currentMessages = newMsgs.concat(currentMessages);
    }
    messageOffset += rows.length;
    renderMessages(rows.length >= MESSAGE_PAGE_SIZE);
  } catch (e) {
    document.getElementById('content').innerHTML =
      `<div class="error">加载失败<br><small>${e.message}</small></div>`;
  }
}

function renderMessages(hasMore) {
  const content = document.getElementById('content');
  if (!currentMessages.length) {
    content.innerHTML = '<div class="empty">这个会话还没有消息</div>';
    return;
  }
  let html = '<div class="msg-list">';
  if (hasMore) {
    const label = currentSource === 'openminis' ? '加载更多消息' : '加载更早的消息';
    html += `<div class="load-more" onclick="loadOlder()">${label}</div>`;
  }
  html += currentMessages.map(m => {
    const role = m.role === 'user' ? 'user' : 'assistant';
    const time = m.created_at || '';
    return `
      <div class="msg-item ${role}">
        <div class="msg-bubble">${escapeHtml(m.content)}</div>
        <div class="msg-meta">${formatTime(time)}</div>
      </div>
    `;
  }).join('');
  html += '</div>';
  content.innerHTML = html;
  // 滚到底部
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'instant' });
}

function loadOlder() {
  const cfg = SOURCES[currentSource];
  loadMessages(currentConversation[cfg.sessionIdField], false);
}

// ====== 工具 ======
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function formatTime(isoStr) {
  if (!isoStr) return '';
  const d = new Date(isoStr);
  if (isNaN(d.getTime())) return '';  // 无效日期直接返回空
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const yesterday = new Date(now); yesterday.setDate(now.getDate() - 1);
  const isYesterday = d.toDateString() === yesterday.toDateString();
  const time = d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  if (sameDay) return time;
  if (isYesterday) return '昨天 ' + time;
  if (d.getFullYear() === now.getFullYear()) {
    return d.toLocaleDateString('zh-CN', { month: 'numeric', day: 'numeric' }) + ' ' + time;
  }
  return d.toLocaleDateString('zh-CN') + ' ' + time;
}

// ====== 登录 / 启动 ======
// 简单的"邮箱即口令"验证。匹配以下任一邮箱即可访问（不区分大小写、忽略前后空格）。
const ALLOWED_EMAILS = ['ronglaiz@yahoo.com', '105229365@qq.com'];
const AUTH_KEY = 'wb_viewer_auth_email';

function isAuthed() {
  const saved = (localStorage.getItem(AUTH_KEY) || '').trim().toLowerCase();
  return ALLOWED_EMAILS.includes(saved);
}

function signIn(email) {
  const normalized = email.trim().toLowerCase();
  if (!ALLOWED_EMAILS.includes(normalized)) {
    throw new Error('邮箱不在允许列表');
  }
  localStorage.setItem(AUTH_KEY, normalized);
  currentUser = { email: normalized };
}

function signOut() {
  localStorage.removeItem(AUTH_KEY);
  currentUser = null;
  showLoginScreen();
}

function showLoginScreen() {
  document.getElementById('headerTitle').textContent = '验证身份';
  document.getElementById('backBtn').classList.remove('visible');
  document.getElementById('searchBox').classList.add('hidden');
  document.getElementById('tabs').style.display = 'none';
  document.getElementById('content').innerHTML = `
    <div style="padding: 40px 24px; max-width: 400px; margin: 0 auto;">
      <div style="font-size: 32px; text-align: center; margin-bottom: 8px;">💪</div>
      <div style="font-size: 17px; font-weight: 600; text-align: center; margin-bottom: 8px;">输入邮箱查看对话</div>
      <div style="font-size: 13px; color: #8e8e93; text-align: center; margin-bottom: 24px;">仅限授权的邮箱可以访问</div>
      <input id="loginEmail" type="email" placeholder="your@email.com" autocomplete="email" style="
        width: 100%; padding: 12px 14px; margin-bottom: 16px;
        border: 0.5px solid rgba(0,0,0,0.15); border-radius: 10px;
        font-size: 15px; background: #fff;
      ">
      <button onclick="doLogin()" style="
        width: 100%; padding: 13px;
        background: #007aff; color: #fff; border: none; border-radius: 10px;
        font-size: 16px; font-weight: 600; cursor: pointer;
      ">进入</button>
      <div id="loginError" style="color: #ff3b30; font-size: 14px; margin-top: 12px; text-align: center;"></div>
    </div>
  `;
  setTimeout(() => {
    const el = document.getElementById('loginEmail');
    if (el) {
      el.focus();
      el.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    }
  }, 100);
}

function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  if (!email) {
    errEl.textContent = '请输入邮箱';
    return;
  }
  try {
    signIn(email);
    document.getElementById('logoutBtn').style.display = 'block';
    document.getElementById('tabs').style.display = 'flex';
    showConversationList();
    loadConversations();
  } catch (e) {
    errEl.textContent = e.message || '验证失败';
  }
}

// ====== 派工 / PR ======
function buildDispatchPrompt(node, worker) {
  const parents = [];
  let cur = node;
  while (cur && cur.parent_id) {
    const parent = allNodes.find(n => n.id === cur.parent_id);
    if (!parent) break;
    parents.unshift(parent);
    cur = parent;
  }
  const path = parents.map(p => p.title).join(' / ') + ' / ' + node.title;
  return `# 施工任务：${node.title}

## 任务路径
${path}

## 背景
${node.summary || '(无)'}

## 状态
当前状态：${STATUS_LABELS[node.status]}
最后活跃：${node.last_activity_at || '-'}

## 施工要求
1. 解决问题后，**直接修改代码**（不要只给方案）
2. 完成后**开一个 PR** 到 ${node.repo || '<仓库待补充>'}${node.branch_name ? `，分支 \`${node.branch_name}\`` : ''}
3. PR 描述里写清楚：修复了什么问题、怎么测的、有没有破坏性变更
4. 把 PR URL 回给我，我会更新工作图谱状态

## 验收标准
- [ ] 问题不再复现 / 功能可用
- [ ] 有测试或人工验证记录
- [ ] PR 通过 review 并合入

---
*派工给：${worker} · ${new Date().toLocaleString('zh-CN')}*`;
}

function openDispatch(nodeId) {
  const node = allNodes.find(n => n.id === nodeId);
  if (!node) return;
  const modal = document.createElement('div');
  modal.className = 'prompt-modal';
  modal.id = 'promptModal';
  modal.innerHTML = `
    <div class="prompt-sheet">
      <div class="prompt-header">
        <div class="prompt-title">派工：${escapeHtml(node.title)}</div>
        <button class="prompt-close" onclick="closeModal()">×</button>
      </div>
      <div class="dispatch-options">
        ${['opencode', 'deepseek', 'claude', 'human'].map(w =>
          `<div class="dispatch-opt" data-worker="${w}" onclick="selectWorker(this)">${w}</div>`
        ).join('')}
      </div>
      <textarea class="prompt-text" id="promptText" rows="14">${escapeHtml(buildDispatchPrompt(node, '<未选择>'))}</textarea>
      <div class="prompt-actions">
        <button class="prompt-copy" onclick="copyPromptAndDispatch('${node.id}')">复制并标记已派工</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
  modal.addEventListener('click', e => {
    if (e.target === modal) closeModal();
  });
}

function selectWorker(el) {
  document.querySelectorAll('.dispatch-opt').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  const nodeId = document.querySelector('.prompt-copy').getAttribute('onclick').match(/'([^']+)'/)[1];
  const node = allNodes.find(n => n.id === nodeId);
  document.getElementById('promptText').value = buildDispatchPrompt(node, el.dataset.worker);
}

function closeModal() {
  document.getElementById('promptModal')?.remove();
}

async function copyPromptAndDispatch(nodeId) {
  const text = document.getElementById('promptText').value;
  const worker = document.querySelector('.dispatch-opt.selected')?.dataset.worker || 'unknown';
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    // 降级：选中文本让用户手动复制
    const ta = document.getElementById('promptText');
    ta.focus(); ta.select();
    document.execCommand('copy');
  }
  // 调 Supabase 标为已派工
  try {
    await sb.rpc('dispatch_ticket', {
      p_node_id: nodeId,
      p_dispatched_to: worker,
      p_dispatch_prompt: text,
    });
  } catch (e) {
    console.error('dispatch rpc failed:', e);
  }
  closeModal();
  // 刷新图谱
  await loadGraph();
}

function openPRDialog(nodeId) {
  const node = allNodes.find(n => n.id === nodeId);
  if (!node) return;
  const prUrl = prompt(`为「${node.title}」登记 PR\n\n请粘贴 GitHub PR URL：`);
  if (!prUrl) return;
  const m = prUrl.match(/github\.com\/[^/]+\/[^/]+\/pull\/(\d+)/);
  const prNumber = m ? parseInt(m[1]) : null;
  attachPR(nodeId, prUrl, prNumber);
}

async function attachPR(nodeId, prUrl, prNumber) {
  try {
    await sb.rpc('attach_pr', {
      p_node_id: nodeId,
      p_pr_url: prUrl,
      p_pr_number: prNumber,
      p_pr_status: 'open',
    });
    await loadGraph();
  } catch (e) {
    alert('PR 登记失败: ' + (e.message || e));
  }
}

async function boot() {
  if (isAuthed()) {
    currentUser = { email: localStorage.getItem(AUTH_KEY) };
    document.getElementById('logoutBtn').style.display = 'block';
    document.getElementById('tabs').style.display = 'flex';
    showConversationList();
    loadConversations();
  } else {
    showLoginScreen();
  }
}

boot();
// 已登录时每 30s 刷新当前视图
setInterval(() => { if (isAuthed()) refresh(); }, 30000);
</script>
